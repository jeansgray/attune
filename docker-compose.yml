services:
  postgres:
    image: postgres:16-alpine
    container_name: attune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attune
      POSTGRES_PASSWORD: attune
      POSTGRES_DB: attune
    ports:
      - "5432:5432"
    volumes:
      - attune_pg:/var/lib/postgresql/data

volumes:
  attune_pg:
